version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped

  voyager:
    build: .
    depends_on:
      - ollama
    volumes:
      - .:/app
    working_dir: /app
    command: go run main.go chat
    stdin_open: true
    tty: true
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}

volumes:
  ollama_data: